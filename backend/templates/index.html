<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart File Organizer Dashboard</title>

    ```
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            padding: 30px;
        }

        .panel {
            background: rgba(30, 41, 59, 0.7);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        h2 {
            color: #94a3b8;
            font-size: 16px;
        }

        .log-container {
            height: 300px;
            overflow-y: auto;
            background: #00000066;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
        }

        .file-item {
            padding: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        button {
            padding: 10px 20px;
            margin-right: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-start {
            background: green;
            color: white;
        }

        .btn-stop {
            background: red;
            color: white;
        }
    </style>
    ```

</head>

<body>

    ```
    <h1>Smart File Organizer Dashboard</h1>

    <button class="btn-start" onclick="toggleSystem('start')">Start</button>
    <button class="btn-stop" onclick="toggleSystem('stop')">Stop</button>

    <!-- STATS -->
    <div class="panel">
        <h2>System Stats</h2>
        <p>Total: <span id="total">0</span></p>
        <p>Duplicates: <span id="dupes">0</span></p>
        <p>Archived: <span id="archived">0</span></p>
    </div>

    <!-- LOGS -->
    <div class="panel">
        <h2>Live Logs</h2>
        <div id="logs" class="log-container"></div>
    </div>

    <!-- PROCESSED FILES -->
    <div class="panel">
        <h2>Processed Files</h2>
        <div id="fileList"></div>
    </div>
    ```

    <script>
        async function toggleSystem(action) {
            const res = await fetch(`/api/${action}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            });
            const data = await res.json();
            if (data.error) {
                alert(data.error);
            }
        }

        // LOAD DATA
        async function loadData() {
            // stats
            const stats = await fetch('/api/stats').then(r => r.json());
            document.getElementById('total').innerText = stats.total;
            document.getElementById('dupes').innerText = stats.duplicates;
            document.getElementById('archived').innerText = stats.archived;

            // logs
            const logData = await fetch('/api/logs').then(r => r.json());
            const logs = document.getElementById('logs');
            logs.innerHTML = logData.logs.map(l => `<div>${l}</div>`).join('');

            // files
            const files = await fetch('/api/files').then(r => r.json());
            const container = document.getElementById('fileList');
            container.innerHTML = "";

            files.forEach(f => {
                const div = document.createElement("div");
                div.className = "file-item";
                div.innerText = `${f.name} | ${f.category} | Duplicate: ${f.duplicate}`;
                container.appendChild(div);
            });
        }

        // IMPORTANT FIX
        loadData();
        setInterval(loadData, 3000);

    </script>

</body>

</html>
