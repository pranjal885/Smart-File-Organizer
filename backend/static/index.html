<!DOCTYPE html>
<html>
<head>
    <title>Smart File Organizer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .buttons {
            margin-bottom: 20px;
        }

        button {
            padding: 10px 15px;
            margin-right: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-btn {
            background: #22c55e;
            color: white;
        }

        .start-btn {
            background: #3b82f6;
            color: white;
        }

        .stop-btn {
            background: #ef4444;
            color: white;
        }

        .cards {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .card {
            flex: 1;
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .card h2 {
            margin: 0;
            font-size: 28px;
        }

        .logs {
            background: black;
            padding: 15px;
            border-radius: 10px;
            height: 250px;
            overflow-y: auto;
            font-family: monospace;
        }

        .status {
            margin: 10px 0;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚀 Smart File Organizer</h1>

    <div class="buttons">
        <button class="login-btn" onclick="login()">Login with Google</button>
        <button class="start-btn" onclick="start()">Start</button>
        <button class="stop-btn" onclick="stop()">Stop</button>
    </div>

    <div class="status" id="status">Status: Loading...</div>

    <!-- STATS -->
    <div class="cards">
        <div class="card">
            <p>Total Files</p>
            <h2 id="total">0</h2>
        </div>

        <div class="card">
            <p>Duplicates</p>
            <h2 id="duplicates">0</h2>
        </div>

        <div class="card">
            <p>Archived</p>
            <h2 id="archived">0</h2>
        </div>
    </div>

    <!-- LOGS -->
    <h3>Live Logs</h3>
    <div class="logs" id="logs"></div>

</div>

<script>
const baseURL = "";

// LOGIN
function login() {
    window.location.href = baseURL + "/login";
}

// START
async function start() {
    const res = await fetch("/api/start", { method: "POST" });
    const data = await res.json();
    alert(JSON.stringify(data));
}

// STOP
async function stop() {
    const res = await fetch("/api/stop", { method: "POST" });
    const data = await res.json();
    alert(JSON.stringify(data));
}

// STATUS
async function getStatus() {
    const res = await fetch("/api/status");
    const data = await res.json();

    document.getElementById("status").innerText =
        data.logged_in ? "Status: Logged In ✅" : "Status: Not Logged In ❌";
}

// STATS
async function getStats() {
    const res = await fetch("/api/stats");
    const data = await res.json();

    document.getElementById("total").innerText = data.total;
    document.getElementById("duplicates").innerText = data.duplicates;
    document.getElementById("archived").innerText = data.archived;
}

// LOGS
async function getLogs() {
    const res = await fetch("/api/logs");
    const data = await res.json();

    let logsDiv = document.getElementById("logs");

    logsDiv.innerHTML = "";

    data.logs.forEach(log => {
        let p = document.createElement("p");
        p.innerText = log;
        logsDiv.appendChild(p);
    });

    logsDiv.scrollTop = logsDiv.scrollHeight;
}

// AUTO REFRESH
setInterval(() => {
    getStatus();
    getStats();
    getLogs();
}, 2000);

</script>

</body>
</html>
